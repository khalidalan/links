<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Links Generator</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box}

:root{
  --bg:#0f172a;
  --card:#111827;
  --soft:#1f2937;
  --border:#2a3344;
  --text:#e5e7eb;
  --muted:#9ca3af;
  --primary:#6366f1;
  --primary-soft:rgba(99,102,241,.15);
  --danger:#ef4444;
  --radius:14px;
}

body{
  font-family:'Inter',sans-serif;
  background:var(--bg);
  color:var(--text);
}

/* layout */
.container{
  max-width:1100px;
  margin:auto;
  padding:32px 20px;
}

/* header */
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:30px;
}

.title{
  font-size:20px;
  font-weight:600;
}

.subtitle{
  font-size:12px;
  color:var(--muted);
}

/* grid */
.grid{
  display:grid;
  grid-template-columns:360px 1fr;
  gap:20px;
}

@media(max-width:900px){
  .grid{grid-template-columns:1fr}
}

/* card */
.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  overflow:hidden;
}

.card-header{
  padding:16px;
  border-bottom:1px solid var(--border);
  font-weight:600;
  font-size:14px;
}

.card-body{
  padding:16px;
}

/* inputs */
.field{
  margin-bottom:14px;
}

.label{
  font-size:12px;
  color:var(--muted);
  margin-bottom:6px;
}

.input{
  width:100%;
  padding:10px;
  border-radius:10px;
  border:1px solid var(--border);
  background:var(--soft);
  color:var(--text);
}

.input:focus{
  border-color:var(--primary);
  outline:none;
}

/* buttons */
.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.btn{
  padding:10px 14px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-size:13px;
}

.btn-primary{
  background:var(--primary);
  color:white;
}

.btn-ghost{
  background:var(--soft);
  color:var(--text);
}

.btn-danger{
  background:rgba(239,68,68,.15);
  color:var(--danger);
}

/* links */
.links{
  max-height:500px;
  overflow:auto;
}

.link{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px;
  border-bottom:1px solid var(--border);
}

.link small{
  color:var(--muted);
  word-break:break-all;
}

.icon-btn{
  background:transparent;
  border:none;
  cursor:pointer;
  color:var(--muted);
}

/* empty */
.empty{
  text-align:center;
  padding:40px;
  color:var(--muted);
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <div>
      <div class="title">Links Generator</div>
      <div class="subtitle">Clean & Fast URL Builder</div>
    </div>
  </div>

  <div class="grid">

    <!-- LEFT -->
    <div class="card">
      <div class="card-header">Configuration</div>

      <div class="card-body">

        <div class="field">
          <div class="label">Track *</div>
          <input id="f-track" class="input">
        </div>

        <div class="field">
          <div class="label">Course *</div>
          <input id="f-course" class="input">
        </div>

        <div class="field">
          <div class="label">Section</div>
          <input id="f-lesson" class="input">
        </div>

        <div class="field">
          <div class="label">Video</div>
          <input id="f-topic" class="input">
        </div>

        <div class="actions">
          <button class="btn btn-primary" onclick="App.generate()">Generate</button>
          <button class="btn btn-ghost" onclick="App.copyAll()">Copy</button>
          <button class="btn btn-danger" onclick="App.clear()">Clear</button>
        </div>

      </div>
    </div>

    <!-- RIGHT -->
    <div class="card">
      <div class="card-header">Generated Links</div>

      <div class="links" id="linksBody">
        <div class="empty">No links yet</div>
      </div>

    </div>

  </div>

</div>

<script>
const BASE='https://almdrasa.com/';

const TYPES={
  course:{build:p=>`tracks/${p.tr}/courses/${p.co}/`},
  lesson:{build:p=>`tracks/${p.tr}/courses/${p.co}/lessons/${p.le}/`},
  topic:{build:p=>`tracks/${p.tr}/courses/${p.co}/lessons/${p.le}/topics/${p.to}`}
};

const S={links:[]};

const $=id=>document.getElementById(id);

const slug=v=>v.toLowerCase().replace(/\s+/g,'-');

function getP(){
  return{
    tr:slug($('f-track').value),
    co:slug($('f-course').value),
    le:slug($('f-lesson').value),
    to:slug($('f-topic').value),
  }
}

const App={
  generate(){
    const p=getP();
    if(!p.tr||!p.co)return;

    S.links=[];

    S.links.push(TYPES.course.build(p));
    if(p.le) S.links.push(TYPES.lesson.build(p));
    if(p.le && p.to) S.links.push(TYPES.topic.build(p));

    draw();
  },

  copyAll(){
    if(!S.links.length)return;
    navigator.clipboard.writeText(S.links.join('\n'));
  },

  clear(){
    ['f-track','f-course','f-lesson','f-topic']
    .forEach(id=>$(id).value='');
    S.links=[];
    draw();
  }
};

function draw(){
  const body=$('linksBody');

  if(!S.links.length){
    body.innerHTML='<div class="empty">No links yet</div>';
    return;
  }

  body.innerHTML=S.links.map(l=>`
    <div class="link">
      <small>${BASE+l}</small>
      <button class="icon-btn" onclick="navigator.clipboard.writeText('${BASE+l}')">📋</button>
    </div>
  `).join('');
}
</script>

</body>
</html>

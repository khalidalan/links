<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مولد الروابط التعليمية</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            animation: fadeInDown 0.6s ease;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .main-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: fadeInUp 0.6s ease;
        }

        .form-section {
            margin-bottom: 30px;
        }

        .form-section h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.5em;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-group label {
            font-weight: 600;
            color: #555;
            font-size: 0.95em;
        }

        .input-group input {
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1em;
            transition: all 0.3s ease;
            background: white;
        }

        .input-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .input-group input::placeholder {
            color: #aaa;
        }

        .checkbox-group {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px;
            background: #f8f9ff;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .checkbox-item:hover {
            background: #eef1ff;
            border-color: #667eea;
        }

        .checkbox-item input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: #667eea;
        }

        .checkbox-item label {
            cursor: pointer;
            user-select: none;
            font-weight: 500;
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .btn {
            padding: 14px 28px;
            border: none;
            border-radius: 10px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
            transform: translateY(-2px);
        }

        .btn-success {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(56, 239, 125, 0.4);
        }

        .preview-section {
            background: #f8f9ff;
            border-radius: 15px;
            padding: 20px;
            margin-top: 30px;
            border: 2px solid #e0e7ff;
        }

        .preview-section h3 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.3em;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .link-category {
            background: white;
            border-radius: 10px;
            padding: 15px;
            border-right: 4px solid #667eea;
        }

        .link-category h4 {
            color: #764ba2;
            margin-bottom: 10px;
            font-size: 1.1em;
        }

        .link-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            background: #f8f9ff;
            border-radius: 8px;
            margin-bottom: 8px;
            transition: all 0.3s ease;
        }

        .link-item:hover {
            background: #eef1ff;
            transform: translateX(-5px);
        }

        .link-text {
            flex: 1;
            font-family: monospace;
            font-size: 0.9em;
            color: #555;
            word-break: break-all;
        }

        .copy-btn {
            padding: 8px 15px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85em;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .copy-btn:hover {
            background: #764ba2;
            transform: scale(1.05);
        }

        .copy-btn.copied {
            background: #38ef7d;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .empty-state-icon {
            font-size: 3em;
            margin-bottom: 15px;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #323232;
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .history-section {
            margin-top: 30px;
            background: white;
            border-radius: 15px;
            padding: 20px;
            border: 2px solid #e0e7ff;
        }

        .history-section h3 {
            color: #667eea;
            margin-bottom: 15px;
        }

        .history-item {
            background: #f8f9ff;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            border-right: 4px solid #667eea;
        }

        .history-item:hover {
            background: #eef1ff;
            transform: translateX(-5px);
        }

        .history-item-title {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }

        .history-item-info {
            font-size: 0.85em;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔗 مولد الروابط التعليمية المحسّن</h1>
            <p>أداة ذكية لإنشاء روابط دورات المدرسة بسهولة وسرعة</p>
        </div>

        <div class="main-card">
            <div class="form-section">
                <h2>📚 المعلومات الأساسية</h2>
                <div class="form-grid">
                    <div class="input-group">
                        <label for="track">المسار (Track) *</label>
                        <input type="text" id="track" placeholder="programming-foundations" required>
                    </div>
                    <div class="input-group">
                        <label for="course">الدورة (Course) *</label>
                        <input type="text" id="course" placeholder="fundamentals" required>
                    </div>
                </div>
                <div class="form-grid">
                    <div class="input-group">
                        <label for="lesson">الدرس (Lesson)</label>
                        <input type="text" id="lesson" placeholder="programming-basics">
                    </div>
                    <div class="input-group">
                        <label for="topic">الموضوع (Topic)</label>
                        <input type="text" id="topic" placeholder="what-is-programming">
                    </div>
                </div>
            </div>

            <div class="form-section">
                <h2>⚙️ أنواع الروابط المطلوبة</h2>
                <div class="checkbox-group">
                    <div class="checkbox-item">
                        <input type="checkbox" id="type-course" value="course" checked>
                        <label for="type-course">صفحة الدورة الرئيسية</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="type-intro" value="intro">
                        <label for="type-intro">مقدمة الدورة</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="type-lesson" value="lesson">
                        <label for="type-lesson">صفحة القسم</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="type-topic" value="topic">
                        <label for="type-topic">صفحة الدرس</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="type-summary" value="summary">
                        <label for="type-summary">ملخص قصير</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="type-quiz" value="quiz">
                        <label for="type-quiz">اختبار قصير</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="type-resource" value="resource">
                        <label for="type-resource">مصادر القسم</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="type-lesson-quiz" value="lesson-quiz">
                        <label for="type-lesson-quiz">اختبار الدرس</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="type-final-quiz" value="final-quiz">
                        <label for="type-final-quiz">الاختبار النهائي</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="type-outro" value="outro">
                        <label for="type-outro">خاتمة الدورة</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="type-assessment" value="assessment">
                        <label for="type-assessment">التسليم النهائي</label>
                    </div>
                </div>
            </div>

            <div class="action-buttons">
                <button class="btn btn-primary" onclick="generateLinks()">
                    ✨ إنشاء الروابط
                </button>
                <button class="btn btn-success" onclick="copyAllLinks()">
                    📋 نسخ كل الروابط
                </button>
                <button class="btn btn-secondary" onclick="clearForm()">
                    🔄 مسح البيانات
                </button>
                <button class="btn btn-secondary" onclick="exportLinks()">
                    💾 تصدير كملف
                </button>
            </div>

            <div class="preview-section" id="previewSection" style="display: none;">
                <h3>📋 الروابط المُنشأة</h3>
                <div class="links-container" id="linksContainer"></div>
            </div>

            <div class="history-section" id="historySection" style="display: none;">
                <h3>📚 السجل السابق</h3>
                <div id="historyContainer"></div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const baseURL = 'https://almdrasa.com';
        let generatedLinks = [];
        let history = [];

        // Real-time preview on input
        document.querySelectorAll('input[type="text"]').forEach(input => {
            input.addEventListener('input', updatePreview);
        });

        document.querySelectorAll('input[type="checkbox"]').forEach(checkbox => {
            checkbox.addEventListener('change', updatePreview);
        });

        function updatePreview() {
            const track = document.getElementById('track').value.trim();
            const course = document.getElementById('course').value.trim();
            
            if (track && course) {
                generateLinks();
            }
        }

        function generateLinks() {
            const track = document.getElementById('track').value.trim();
            const course = document.getElementById('course').value.trim();
            const lesson = document.getElementById('lesson').value.trim();
            const topic = document.getElementById('topic').value.trim();

            if (!track || !course) {
                showToast('⚠️ يرجى إدخال المسار والدورة على الأقل');
                return;
            }

            generatedLinks = [];
            const selectedTypes = Array.from(document.querySelectorAll('input[type="checkbox"]:checked'))
                .map(cb => cb.value);

            const linksContainer = document.getElementById('linksContainer');
            linksContainer.innerHTML = '';

            // Generate links based on selected types
            selectedTypes.forEach(type => {
                const links = generateLinksByType(type, track, course, lesson, topic);
                if (links.length > 0) {
                    generatedLinks.push(...links);
                }
            });

            // Group links by category
            const grouped = groupLinksByCategory(generatedLinks);
            
            // Display grouped links
            Object.keys(grouped).forEach(category => {
                const categoryDiv = document.createElement('div');
                categoryDiv.className = 'link-category';
                categoryDiv.innerHTML = `<h4>${category}</h4>`;
                
                grouped[category].forEach(link => {
                    const linkItem = document.createElement('div');
                    linkItem.className = 'link-item';
                    linkItem.innerHTML = `
                        <div class="link-text">${link}</div>
                        <button class="copy-btn" onclick="copyLink('${link}', this)">نسخ</button>
                    `;
                    categoryDiv.appendChild(linkItem);
                });
                
                linksContainer.appendChild(categoryDiv);
            });

            document.getElementById('previewSection').style.display = 'block';
            
            // Save to history
            saveToHistory(track, course, lesson, topic, selectedTypes);
        }

        function generateLinksByType(type, track, course, lesson, topic) {
            const links = [];
            const baseTrackCourse = `${baseURL}/tracks/${track}/courses/${course}`;

            switch(type) {
                case 'course':
                    links.push(`${baseTrackCourse}/`);
                    break;
                case 'intro':
                    links.push(`${baseTrackCourse}/lessons/${course}-course-introduction/`);
                    break;
                case 'lesson':
                    if (lesson) {
                        links.push(`${baseTrackCourse}/lessons/${lesson}/`);
                    }
                    break;
                case 'topic':
                    if (lesson && topic) {
                        links.push(`${baseTrackCourse}/lessons/${lesson}/topic/${topic}/`);
                    }
                    break;
                case 'summary':
                    if (lesson && topic) {
                        links.push(`${baseTrackCourse}/lessons/${lesson}/topics/short-summary-${topic}/quizzes/short-quiz-${topic}/`);
                    }
                    break;
                case 'quiz':
                    if (topic) {
                        links.push(`${baseURL}/topics/short-summary-${topic}/`);
                    }
                    break;
                case 'resource':
                    if (lesson) {
                        links.push(`${baseTrackCourse}/lessons/${lesson}/resources/${lesson}-resource`);
                    }
                    break;
                case 'lesson-quiz':
                    if (lesson) {
                        links.push(`${baseTrackCourse}/lessons/${lesson}/quizzes/${lesson}-quiz/`);
                    }
                    break;
                case 'final-quiz':
                    links.push(`${baseTrackCourse}/quizzes/${course}-final-quiz/`);
                    break;
                case 'outro':
                    links.push(`${baseTrackCourse}/lessons/${course}-course-outro/`);
                    break;
                case 'assessment':
                    links.push(`${baseTrackCourse}/lessons/${course}-final-assessment`);
                    break;
            }

            return links;
        }

        function groupLinksByCategory(links) {
            const grouped = {};
            
            links.forEach(link => {
                let category = 'عام';
                
                if (link.includes('/lessons/') && link.includes('-introduction')) category = '🎬 المقدمة';
                else if (link.includes('/lessons/') && link.includes('-outro')) category = '🎬 الخاتمة';
                else if (link.includes('/lessons/') && !link.includes('/topic/') && !link.includes('/quizzes/')) category = '📖 الدروس';
                else if (link.includes('/topic/')) category = '📝 المواضيع';
                else if (link.includes('/topics/short-summary')) category = '📄 الملخصات';
                else if (link.includes('/quizzes/') && link.includes('final')) category = '🎯 الاختبارات النهائية';
                else if (link.includes('/quizzes/')) category = '✅ الاختبارات';
                else if (link.includes('/resources/')) category = '📚 المصادر';
                else if (link.includes('/final-assessment')) category = '📊 التقييمات';
                else if (link.includes('/courses/') && link.split('/').length <= 6) category = '🏠 الصفحة الرئيسية';
                
                if (!grouped[category]) grouped[category] = [];
                grouped[category].push(link);
            });
            
            return grouped;
        }

        function copyLink(link, button) {
            navigator.clipboard.writeText(link).then(() => {
                const originalText = button.textContent;
                button.textContent = '✓ تم النسخ';
                button.classList.add('copied');
                
                setTimeout(() => {
                    button.textContent = originalText;
                    button.classList.remove('copied');
                }, 2000);
                
                showToast('✓ تم نسخ الرابط بنجاح');
            });
        }

        function copyAllLinks() {
            if (generatedLinks.length === 0) {
                showToast('⚠️ لا توجد روابط لنسخها');
                return;
            }

            const allLinks = generatedLinks.join('\n');
            navigator.clipboard.writeText(allLinks).then(() => {
                showToast(`✓ تم نسخ ${generatedLinks.length} رابط بنجاح`);
            });
        }

        function clearForm() {
            document.getElementById('track').value = '';
            document.getElementById('course').value = '';
            document.getElementById('lesson').value = '';
            document.getElementById('topic').value = '';
            document.getElementById('previewSection').style.display = 'none';
            generatedLinks = [];
            showToast('🔄 تم مسح البيانات');
        }

        function exportLinks() {
            if (generatedLinks.length === 0) {
                showToast('⚠️ لا توجد روابط للتصدير');
                return;
            }

            const content = generatedLinks.join('\n');
            const blob = new Blob([content], { type: 'text/plain' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `links-${Date.now()}.txt`;
            a.click();
            window.URL.revokeObjectURL(url);
            
            showToast('💾 تم تصدير الروابط بنجاح');
        }

        function saveToHistory(track, course, lesson, topic, types) {
            const entry = {
                timestamp: Date.now(),
                track,
                course,
                lesson,
                topic,
                types,
                links: [...generatedLinks]
            };
            
            history.unshift(entry);
            if (history.length > 10) history = history.slice(0, 10);
            
            updateHistoryDisplay();
        }

        function updateHistoryDisplay() {
            if (history.length === 0) {
                document.getElementById('historySection').style.display = 'none';
                return;
            }

            document.getElementById('historySection').style.display = 'block';
            const container = document.getElementById('historyContainer');
            container.innerHTML = '';

            history.forEach((entry, index) => {
                const item = document.createElement('div');
                item.className = 'history-item';
                item.onclick = () => loadFromHistory(index);
                
                const date = new Date(entry.timestamp).toLocaleString('ar-EG');
                item.innerHTML = `
                    <div class="history-item-title">
                        ${entry.track} / ${entry.course} ${entry.lesson ? '/ ' + entry.lesson : ''}
                    </div>
                    <div class="history-item-info">
                        ${date} • ${entry.links.length} رابط
                    </div>
                `;
                container.appendChild(item);
            });
        }

        function loadFromHistory(index) {
            const entry = history[index];
            document.getElementById('track').value = entry.track;
            document.getElementById('course').value = entry.course;
            document.getElementById('lesson').value = entry.lesson || '';
            document.getElementById('topic').value = entry.topic || '';
            
            // Update checkboxes
            document.querySelectorAll('input[type="checkbox"]').forEach(cb => {
                cb.checked = entry.types.includes(cb.value);
            });
            
            generateLinks();
            showToast('✓ تم تحميل البيانات من السجل');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }
    </script>
</body>
</html>


<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Almdrasa Links Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  /* ===================== RESET & ROOT ===================== */
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg0: #080b10;
    --bg1: #0d1117;
    --bg2: #131820;
    --bg3: #1a2030;
    --line: rgba(255,255,255,0.06);
    --line2: rgba(255,255,255,0.1);
    --accent: #00e5ff;
    --accent2: #0077ff;
    --accent-dim: rgba(0,229,255,0.12);
    --accent-dim2: rgba(0,229,255,0.06);
    --green: #00ffb3;
    --green-dim: rgba(0,255,179,0.1);
    --red: #ff4d6d;
    --red-dim: rgba(255,77,109,0.1);
    --yellow: #ffd166;
    --txt0: #f0f4f8;
    --txt1: #8899aa;
    --txt2: #4a5568;
    --mono: 'JetBrains Mono', monospace;
    --sans: 'IBM Plex Sans Arabic', sans-serif;
    --display: 'Syne', sans-serif;
    --radius: 10px;
    --radius-lg: 16px;
  }

  html[lang="ar"] { font-family: var(--sans); }

  body {
    font-family: var(--sans);
    background: var(--bg0);
    color: var(--txt0);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ===================== GRID BG ===================== */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(0,229,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,229,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none; z-index: 0;
  }

  body::after {
    content: '';
    position: fixed;
    top: -30vh; left: -20vw;
    width: 80vw; height: 80vh;
    background: radial-gradient(ellipse, rgba(0,119,255,0.07) 0%, transparent 70%);
    pointer-events: none; z-index: 0;
  }

  /* ===================== LAYOUT ===================== */
  .shell {
    position: relative; z-index: 1;
    max-width: 1100px;
    margin: 0 auto;
    padding: 32px 24px 80px;
  }

  /* ===================== HEADER ===================== */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 40px;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--line);
  }

  .logo-area {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .logo-icon {
    width: 42px; height: 42px;
    background: linear-gradient(135deg, var(--accent2), var(--accent));
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }

  .logo-icon svg { width: 22px; height: 22px; color: #fff; }

  .logo-text h1 {
    font-family: var(--display);
    font-size: 1.25rem;
    font-weight: 800;
    letter-spacing: -0.02em;
    color: var(--txt0);
    line-height: 1;
  }

  .logo-text p {
    font-size: 0.75rem;
    color: var(--txt1);
    margin-top: 3px;
  }

  .header-controls {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  /* ===================== LANG TOGGLE ===================== */
  .lang-toggle {
    display: flex;
    background: var(--bg2);
    border: 1px solid var(--line2);
    border-radius: 8px;
    padding: 3px;
    gap: 2px;
  }

  .lang-btn {
    padding: 6px 14px;
    border: none;
    border-radius: 6px;
    background: transparent;
    color: var(--txt1);
    font-size: 0.78rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.05em;
    font-family: var(--mono);
  }

  .lang-btn.active {
    background: var(--accent);
    color: #000;
  }

  /* ===================== MAIN GRID ===================== */
  .main-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  @media (max-width: 768px) {
    .main-grid { grid-template-columns: 1fr; }
  }

  .panel {
    background: var(--bg1);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    overflow: hidden;
  }

  .panel-full {
    grid-column: 1 / -1;
  }

  .panel-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .panel-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--txt1);
    font-family: var(--mono);
  }

  .panel-title svg { width: 14px; height: 14px; color: var(--accent); }

  .panel-body { padding: 20px; }

  /* ===================== INPUTS ===================== */
  .fields-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  @media (max-width: 500px) {
    .fields-grid { grid-template-columns: 1fr; }
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .field label {
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--txt1);
    font-family: var(--mono);
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .field label .req { color: var(--accent); }
  .field label .opt { color: var(--txt2); font-size: 0.65rem; }

  .field input {
    background: var(--bg2);
    border: 1px solid var(--line2);
    border-radius: var(--radius);
    padding: 10px 14px;
    font-size: 0.85rem;
    font-family: var(--mono);
    color: var(--txt0);
    transition: all 0.2s;
    width: 100%;
  }

  .field input:focus {
    outline: none;
    border-color: var(--accent);
    background: var(--bg3);
    box-shadow: 0 0 0 3px rgba(0,229,255,0.08);
  }

  .field input::placeholder { color: var(--txt2); }

  .field input.has-value {
    border-color: rgba(0,229,255,0.3);
  }

  .field input.error {
    border-color: var(--red);
    box-shadow: 0 0 0 3px var(--red-dim);
    animation: shake 0.3s ease;
  }

  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-4px); }
    75% { transform: translateX(4px); }
  }

  /* URL Preview inside input */
  .url-preview {
    margin-top: 8px;
    padding: 10px 14px;
    background: var(--bg0);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    font-family: var(--mono);
    font-size: 0.72rem;
    line-height: 1.7;
    color: var(--txt1);
    word-break: break-all;
    min-height: 36px;
    display: none;
  }

  .url-preview.visible { display: block; }
  .url-preview .seg-base { color: var(--txt2); }
  .url-preview .seg-track { color: var(--accent); }
  .url-preview .seg-course { color: var(--green); }
  .url-preview .seg-lesson { color: var(--yellow); }
  .url-preview .seg-topic { color: #ff9f43; }

  /* ===================== CHECKBOXES ===================== */
  .cb-toolbar {
    display: flex;
    gap: 6px;
    align-items: center;
  }

  .mini-btn {
    padding: 4px 10px;
    border: 1px solid var(--line2);
    border-radius: 6px;
    background: var(--bg2);
    color: var(--txt1);
    font-size: 0.7rem;
    font-weight: 600;
    font-family: var(--mono);
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.04em;
  }

  .mini-btn:hover { border-color: var(--accent); color: var(--accent); }

  .cb-groups {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .cb-group-label {
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--txt2);
    font-family: var(--mono);
    margin-bottom: 6px;
    padding-bottom: 5px;
    border-bottom: 1px solid var(--line);
  }

  .cb-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .cb-chip {
    position: relative;
  }

  .cb-chip input[type="checkbox"] {
    position: absolute;
    opacity: 0;
    width: 0; height: 0;
  }

  .cb-chip label {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    background: var(--bg2);
    border: 1px solid var(--line2);
    border-radius: 6px;
    font-size: 0.78rem;
    font-weight: 500;
    color: var(--txt1);
    cursor: pointer;
    transition: all 0.18s;
    user-select: none;
    white-space: nowrap;
  }

  .cb-chip label svg { width: 13px; height: 13px; flex-shrink: 0; }

  .cb-chip input:checked + label {
    background: var(--accent-dim);
    border-color: var(--accent);
    color: var(--accent);
  }

  .cb-chip input:disabled + label {
    opacity: 0.35;
    cursor: not-allowed;
    pointer-events: none;
  }

  .cb-chip label:hover:not(.disabled) {
    border-color: var(--accent);
    color: var(--txt0);
    background: var(--accent-dim2);
  }

  /* ===================== ACTION BUTTONS ===================== */
  .actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    padding: 16px 20px;
    border-top: 1px solid var(--line);
    background: var(--bg0);
  }

  .btn {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 9px 18px;
    border: none;
    border-radius: var(--radius);
    font-size: 0.8rem;
    font-weight: 600;
    font-family: var(--mono);
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.02em;
    white-space: nowrap;
  }

  .btn svg { width: 14px; height: 14px; flex-shrink: 0; }

  .btn-primary {
    background: linear-gradient(135deg, var(--accent2), var(--accent));
    color: #000;
  }
  .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); box-shadow: 0 4px 20px rgba(0,229,255,0.25); }
  .btn-primary:active { transform: translateY(0); }

  .btn-ghost {
    background: var(--bg2);
    color: var(--txt1);
    border: 1px solid var(--line2);
  }
  .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }

  .btn-danger {
    background: var(--red-dim);
    color: var(--red);
    border: 1px solid rgba(255,77,109,0.2);
  }
  .btn-danger:hover { background: rgba(255,77,109,0.2); }

  /* ===================== BASE URL TOGGLE ===================== */
  .url-toggle-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 20px;
    border-bottom: 1px solid var(--line);
    background: var(--bg0);
  }

  .url-toggle-bar span {
    font-size: 0.72rem;
    color: var(--txt1);
    font-family: var(--mono);
  }

  .toggle-switch {
    position: relative;
    width: 36px; height: 20px;
    flex-shrink: 0;
  }

  .toggle-switch input { opacity: 0; width: 0; height: 0; }

  .toggle-slider {
    position: absolute; inset: 0;
    background: var(--bg3);
    border: 1px solid var(--line2);
    border-radius: 20px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .toggle-slider::before {
    content: '';
    position: absolute;
    left: 2px; top: 2px;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--txt2);
    transition: all 0.2s;
  }

  .toggle-switch input:checked + .toggle-slider { background: var(--accent-dim); border-color: var(--accent); }
  .toggle-switch input:checked + .toggle-slider::before { transform: translateX(16px); background: var(--accent); }

  .base-url-label {
    font-family: var(--mono);
    font-size: 0.7rem;
    color: var(--txt2);
    background: var(--bg2);
    padding: 2px 8px;
    border-radius: 4px;
    border: 1px solid var(--line);
  }

  /* ===================== SEARCH BAR ===================== */
  .search-bar {
    padding: 12px 20px;
    border-bottom: 1px solid var(--line);
  }

  .search-wrap {
    position: relative;
  }

  .search-wrap svg {
    position: absolute;
    left: 12px; top: 50%;
    transform: translateY(-50%);
    width: 14px; height: 14px;
    color: var(--txt2);
    pointer-events: none;
  }

  html[dir="rtl"] .search-wrap svg { left: auto; right: 12px; }

  .search-wrap input {
    width: 100%;
    background: var(--bg2);
    border: 1px solid var(--line2);
    border-radius: var(--radius);
    padding: 8px 12px 8px 36px;
    font-family: var(--mono);
    font-size: 0.8rem;
    color: var(--txt0);
    transition: all 0.2s;
  }

  html[dir="rtl"] .search-wrap input { padding: 8px 36px 8px 12px; }

  .search-wrap input:focus { outline: none; border-color: var(--accent); }
  .search-wrap input::placeholder { color: var(--txt2); }

  /* ===================== LINKS OUTPUT ===================== */
  .output-empty {
    padding: 60px 20px;
    text-align: center;
    color: var(--txt2);
  }

  .output-empty svg { width: 40px; height: 40px; opacity: 0.3; margin-bottom: 12px; }
  .output-empty p { font-size: 0.85rem; }

  .link-category {
    border-bottom: 1px solid var(--line);
  }

  .link-category:last-child { border-bottom: none; }

  .cat-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 20px;
    background: var(--bg0);
    cursor: pointer;
    user-select: none;
    transition: background 0.15s;
  }

  .cat-header:hover { background: var(--bg2); }

  .cat-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-family: var(--mono);
    color: var(--txt1);
  }

  .cat-title svg { width: 13px; height: 13px; color: var(--accent); }

  .cat-count {
    background: var(--accent-dim);
    color: var(--accent);
    border-radius: 20px;
    padding: 1px 8px;
    font-size: 0.65rem;
    font-family: var(--mono);
    font-weight: 700;
  }

  .cat-chevron { width: 14px; height: 14px; color: var(--txt2); transition: transform 0.2s; }
  .cat-chevron.open { transform: rotate(180deg); }

  .cat-body { display: none; }
  .cat-body.open { display: block; }

  .link-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 20px;
    border-top: 1px solid var(--line);
    transition: background 0.15s;
  }

  .link-row:hover { background: var(--bg2); }
  .link-row.hidden { display: none; }

  .link-url {
    flex: 1;
    font-family: var(--mono);
    font-size: 0.75rem;
    color: var(--txt1);
    word-break: break-all;
    line-height: 1.5;
  }

  .link-url .seg-track { color: var(--accent); }
  .link-url .seg-course { color: var(--green); }
  .link-url .seg-lesson { color: var(--yellow); }
  .link-url .seg-topic { color: #ff9f43; }
  .link-url .seg-base { color: var(--txt2); }

  .link-actions {
    display: flex;
    gap: 4px;
    flex-shrink: 0;
  }

  .icon-btn {
    width: 30px; height: 30px;
    border: 1px solid var(--line2);
    border-radius: 6px;
    background: var(--bg2);
    color: var(--txt1);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
    flex-shrink: 0;
  }

  .icon-btn svg { width: 13px; height: 13px; }

  .icon-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }

  .icon-btn.copied { border-color: var(--green); color: var(--green); background: var(--green-dim); }

  /* ===================== STATS BAR ===================== */
  .stats-bar {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 10px 20px;
    border-top: 1px solid var(--line);
    background: var(--bg0);
  }

  .stat-item {
    display: flex;
    align-items: center;
    gap: 5px;
    font-family: var(--mono);
    font-size: 0.72rem;
    color: var(--txt1);
  }

  .stat-item strong { color: var(--accent); }

  /* ===================== HISTORY ===================== */
  .history-list {
    display: flex;
    flex-direction: column;
    gap: 0;
  }

  .history-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 20px;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
    transition: background 0.15s;
  }

  .history-item:last-child { border-bottom: none; }
  .history-item:hover { background: var(--bg2); }

  .history-item-icon {
    width: 32px; height: 32px;
    background: var(--bg2);
    border: 1px solid var(--line2);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }

  .history-item-icon svg { width: 14px; height: 14px; color: var(--accent); }

  .history-item-body { flex: 1; min-width: 0; }

  .history-item-title {
    font-family: var(--mono);
    font-size: 0.78rem;
    color: var(--txt0);
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .history-item-meta {
    font-size: 0.7rem;
    color: var(--txt2);
    margin-top: 2px;
    font-family: var(--mono);
  }

  .history-item-count {
    background: var(--bg2);
    border: 1px solid var(--line);
    color: var(--txt1);
    font-family: var(--mono);
    font-size: 0.65rem;
    padding: 2px 8px;
    border-radius: 20px;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .history-empty {
    padding: 40px 20px;
    text-align: center;
    color: var(--txt2);
    font-size: 0.82rem;
    font-family: var(--mono);
  }

  /* ===================== TOAST ===================== */
  .toasts {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    gap: 8px;
    z-index: 9999;
    pointer-events: none;
    min-width: 280px;
  }

  .toast {
    background: var(--bg3);
    border: 1px solid var(--line2);
    border-radius: 10px;
    padding: 12px 18px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: var(--mono);
    font-size: 0.8rem;
    color: var(--txt0);
    box-shadow: 0 8px 32px rgba(0,0,0,0.6);
    animation: toastIn 0.3s ease forwards;
    pointer-events: all;
  }

  .toast.out { animation: toastOut 0.3s ease forwards; }
  .toast svg { width: 16px; height: 16px; flex-shrink: 0; }
  .toast.success { border-color: rgba(0,255,179,0.3); }
  .toast.success svg { color: var(--green); }
  .toast.error { border-color: rgba(255,77,109,0.3); }
  .toast.error svg { color: var(--red); }
  .toast.info svg { color: var(--accent); }

  @keyframes toastIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes toastOut {
    from { opacity: 1; transform: translateY(0); }
    to { opacity: 0; transform: translateY(12px); }
  }

  /* ===================== KEYBOARD HINT ===================== */
  .kbd {
    display: inline-flex;
    align-items: center;
    background: var(--bg2);
    border: 1px solid var(--line2);
    border-radius: 4px;
    padding: 1px 5px;
    font-family: var(--mono);
    font-size: 0.65rem;
    color: var(--txt2);
  }

  /* ===================== SCROLLBAR ===================== */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg1); }
  ::-webkit-scrollbar-thumb { background: var(--bg3); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--accent2); }

  /* ===================== FADE IN ===================== */
  .fade-in {
    animation: fadeIn 0.35s ease forwards;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<div class="shell">

  <!-- HEADER -->
  <header class="header">
    <div class="logo-area">
      <div class="logo-icon">
        <i data-lucide="link-2"></i>
      </div>
      <div class="logo-text">
        <h1 id="mainTitle">Links Generator</h1>
        <p id="subtitle">Almdrasa URL Builder</p>
      </div>
    </div>
    <div class="header-controls">
      <div class="lang-toggle">
        <button class="lang-btn active" onclick="App.switchLang('en', this)">EN</button>
        <button class="lang-btn" onclick="App.switchLang('ar', this)">AR</button>
      </div>
    </div>
  </header>

  <div class="main-grid">

    <!-- LEFT: INPUTS -->
    <div class="panel">
      <div class="panel-header">
        <div class="panel-title">
          <i data-lucide="settings-2"></i>
          <span id="configLabel">Configuration</span>
        </div>
        <span class="kbd" id="kbdHint">⌘↵ generate</span>
      </div>

/* ── STATE ── */
const State = {
  lang: 'en',
  links: [],      // [{ url, category, typeId }]
  history: JSON.parse(localStorage.getItem('alm_history') || '[]'),

  save() {
    localStorage.setItem('alm_history', JSON.stringify(this.history));
  }
};

/* ── HELPERS ── */
function slug(v) {
  return v.toLowerCase().replace(/\s+/g, '-');
}

function getParams() {
  return {
    track: slug(document.getElementById('track').value.trim()),
    course: slug(document.getElementById('course').value.trim()),
    lesson: slug(document.getElementById('lesson').value.trim()),
    topic: slug(document.getElementById('topic').value.trim())
  };
}

function checkedTypes() {
  return Array.from(document.querySelectorAll('.cb-type:checked')).map(el => el.value);
}

function t(key, vars) {
  let str = T[State.lang][key] || key;
  if (vars) Object.entries(vars).forEach(([k,v]) => { str = str.replace(`{${k}}`, v); });
  return str;
}

function toastMsg(k, vars, type = 'info') {
  const msg = T[State.lang].toasts[k] || k;
  const final = vars ? msg.replace(/{n}/, vars.n) : msg;
  showToast(final, type);
}

/* ── TOAST ── */
function showToast(msg, type = 'info') {
  const icons = { success: 'check-circle', error: 'x-circle', info: 'info' };
  const container = document.getElementById('toastContainer');
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.innerHTML = `<i data-lucide="${icons[type]}"></i><span>${msg}</span>`;
  container.appendChild(el);
  lucide.createIcons({ el });
  setTimeout(() => {
    el.classList.add('out');
    setTimeout(() => el.remove(), 300);
  }, 2600);
}

/* ── URL HIGHLIGHT ── */
function highlightURL(path, includeBase) {
  const prefix = includeBase ? `<span class="seg-base">${BASE_URL}</span>` : '';
  const parts = path.split('/');
  let html = prefix;
  let state = 'start';
  parts.forEach((p, i) => {
    if (!p) { html += '/'; return; }
    const sep = i > 0 ? '/' : '';
    if (p === 'tracks') { html += sep + p; state = 'track'; }
    else if (state === 'track') { html += `/<span class="seg-track">${p}</span>`; state = 'courses'; }
    else if (p === 'courses') { html += `/${p}`; state = 'course'; }
    else if (state === 'course') { html += `/<span class="seg-course">${p}</span>`; state = 'after-course'; }
    else if (p === 'lessons') { html += `/${p}`; state = 'lesson'; }
    else if (state === 'lesson') { html += `/<span class="seg-lesson">${p}</span>`; state = 'after-lesson'; }
    else if (p === 'topics') { html += `/${p}`; state = 'topic'; }
    else if (state === 'topic') { html += `/<span class="seg-topic">${p}</span>`; state = 'after-topic'; }
    else { html += sep + p; }
  });
  return html;
}

/* ── BUILD CHECKBOXES (dynamic from config) ── */
function buildCheckboxes() {
  const params = getParams();
  const container = document.getElementById('cbGroupsContainer');
  const lang = State.lang;

  let html = '<div class="cb-groups">';
  Object.entries(CATEGORIES).forEach(([catId, cat]) => {
    const typesInCat = Object.entries(LINK_TYPES).filter(([,c]) => c.category === catId);
    html += `<div>
      <div class="cb-group-label">${cat.label[lang]}</div>
      <div class="cb-row">`;
    typesInCat.forEach(([typeId, config]) => {
      const needLesson = config.requires.includes('lesson');
      const needTopic = config.requires.includes('topic');
      const disabled = (needLesson && !params.lesson) || (needTopic && !params.topic);
      const checked = document.getElementById(`cb-${typeId}`)?.checked ?? true;
      html += `
        <div class="cb-chip">
          <input type="checkbox" class="cb-type" id="cb-${typeId}" value="${typeId}"
            ${checked ? 'checked' : ''} ${disabled ? 'disabled' : ''}>
          <label for="cb-${typeId}">
            <i data-lucide="${config.icon}"></i>
            ${config.label[lang]}
          </label>
        </div>`;
    });
    html += `</div></div>`;
  });
  html += '</div>';
  container.innerHTML = html;
  lucide.createIcons({ el: container });

  // re-bind checkbox change → live update
  document.querySelectorAll('.cb-type').forEach(cb => {
    cb.addEventListener('change', () => { if (State.links.length) App.generate(true); });
  });
}

/* ── LIVE URL PREVIEW ── */
function updateURLPreview() {
  const params = getParams();
  const preview = document.getElementById('urlPreview');
  if (!params.track || !params.course) { preview.classList.remove('visible'); return; }

  let path = `tracks/${params.track}/courses/${params.course}/`;
  if (params.lesson) path += `lessons/${params.lesson}/`;
  if (params.topic) path += `topics/${params.topic}`;

  preview.innerHTML = highlightURL(path, false);
  preview.classList.add('visible');
}

/* ── DISPLAY LINKS ── */
function displayLinks() {
  const includeBase = document.getElementById('includeBase').checked;
  const body = document.getElementById('outputBody');
  const emptyState = document.getElementById('emptyState');

  if (State.links.length === 0) {
    body.innerHTML = '';
    body.appendChild(emptyState);
    emptyState.style.display = '';
    document.getElementById('statsBar').style.display = 'none';
    document.getElementById('linkCount').textContent = '0';
    return;
  }

  emptyState.style.display = 'none';

  // Group by category
  const grouped = {};
  State.links.forEach(link => {
    if (!grouped[link.category]) grouped[link.category] = [];
    grouped[link.category].push(link);
  });

  let html = '';
  Object.entries(grouped).forEach(([catId, links]) => {
    const cat = CATEGORIES[catId];
    const catLabel = cat ? cat.label[State.lang] : catId;
    const catIcon = cat ? cat.icon : 'folder';

    html += `
      <div class="link-category fade-in">
        <div class="cat-header" onclick="toggleCat(this)">
          <div class="cat-title">
            <i data-lucide="${catIcon}"></i>
            ${catLabel}
            <span class="cat-count">${links.length}</span>
          </div>
          <i data-lucide="chevron-down" class="cat-chevron open"></i>
        </div>
        <div class="cat-body open">`;

    links.forEach(link => {
      const display = includeBase ? BASE_URL + link.url : link.url;
      const highlighted = highlightURL(link.url, includeBase);
      html += `
          <div class="link-row" data-url="${display}">
            <div class="link-url">${highlighted}</div>
            <div class="link-actions">
              <button class="icon-btn" title="Copy" onclick="App.copyLink(this, '${display.replace(/'/g, "\\'")}')">
                <i data-lucide="copy"></i>
              </button>
              <a href="${BASE_URL}${link.url}" target="_blank" class="icon-btn" title="Open">
                <i data-lucide="external-link"></i>
              </a>
            </div>
          </div>`;
    });

    html += `</div></div>`;
  });

  body.innerHTML = html;
  lucide.createIcons({ el: body });

  // Stats
  document.getElementById('statsBar').style.display = 'flex';
  document.getElementById('linkCount').textContent = State.links.length;
  document.getElementById('catCountStat').textContent = Object.keys(grouped).length;
  document.getElementById('totalStat').textContent = State.links.length;

  // Re-apply search
  App.filterLinks();
}

function toggleCat(header) {
  const body = header.nextElementSibling;
  const chevron = header.querySelector('.cat-chevron');
  body.classList.toggle('open');
  chevron.classList.toggle('open');
}

/* ── HISTORY DISPLAY ── */
function displayHistory() {
  const body = document.getElementById('historyBody');
  const empty = document.getElementById('historyEmpty');

  if (State.history.length === 0) {
    body.innerHTML = '';
    body.appendChild(empty);
    return;
  }

  let html = '<div class="history-list">';
  State.history.forEach((entry, i) => {
    const date = new Date(entry.ts).toLocaleString(State.lang === 'ar' ? 'ar-EG' : 'en-US', {
      month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
    });
    const subtitle = [entry.params.track, entry.params.course, entry.params.lesson]
      .filter(Boolean).join(' / ');
    html += `
      <div class="history-item" onclick="App.loadHistory(${i})">
        <div class="history-item-icon"><i data-lucide="clock"></i></div>
        <div class="history-item-body">
          <div class="history-item-title">${subtitle}</div>
          <div class="history-item-meta">${date}</div>
        </div>
        <span class="history-item-count">${entry.links.length} links</span>
      </div>`;
  });
  html += '</div>';
  body.innerHTML = html;
  lucide.createIcons({ el: body });
}

/* ── MAIN APP OBJECT ── */
const App = {

  generate(silent = false) {
    const params = getParams();
    if (!params.track || !params.course) {
      if (!silent) {
        document.getElementById('track').classList.add('error');
        document.getElementById('course').classList.add('error');
        setTimeout(() => {
          document.getElementById('track').classList.remove('error');
          document.getElementById('course').classList.remove('error');
        }, 800);
        toastMsg('fillRequired', null, 'error');
      }
      return;
    }

    const selected = checkedTypes();
    State.links = [];

    selected.forEach(typeId => {
      const config = LINK_TYPES[typeId];
      if (!config) return;
      const missing = config.requires.some(f => !params[f]);
      if (missing) return;
      State.links.push({
        url: config.build(params),
        category: config.category,
        typeId
      });
    });

    displayLinks();

    // Save history
    State.history.unshift({ ts: Date.now(), params, links: State.links, types: selected });
    if (State.history.length > 20) State.history = State.history.slice(0, 20);
    State.save();
    displayHistory();
  },

  refreshDisplay() {
    displayLinks();
  },

  filterLinks() {
    const q = document.getElementById('searchInput').value.toLowerCase();
    document.querySelectorAll('.link-row').forEach(row => {
      const url = (row.dataset.url || '').toLowerCase();
      row.classList.toggle('hidden', q.length > 0 && !url.includes(q));
    });
  },

  copyLink(btn, url) {
    navigator.clipboard.writeText(url).then(() => {
      btn.classList.add('copied');
      btn.innerHTML = '<i data-lucide="check"></i>';
      lucide.createIcons({ el: btn });
      setTimeout(() => {
        btn.classList.remove('copied');
        btn.innerHTML = '<i data-lucide="copy"></i>';
        lucide.createIcons({ el: btn });
      }, 1800);
      toastMsg('copied', null, 'success');
    });
  },

  copyAll() {
    if (!State.links.length) { toastMsg('noLinks', null, 'error'); return; }
    const includeBase = document.getElementById('includeBase').checked;
    const text = State.links.map(l => includeBase ? BASE_URL + l.url : l.url).join('\n');
    navigator.clipboard.writeText(text).then(() => {
      toastMsg('allCopied', { n: State.links.length }, 'success');
    });
  },

  exportLinks() {
    if (!State.links.length) { toastMsg('noExport', null, 'error'); return; }
    const includeBase = document.getElementById('includeBase').checked;
    const lines = State.links.map(l => includeBase ? BASE_URL + l.url : l.url);
    const blob = new Blob([lines.join('\n')], { type: 'text/plain' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `almdrasa-links-${Date.now()}.txt`;
    a.click();
    URL.revokeObjectURL(a.href);
    toastMsg('exported', null, 'success');
  },

  clearForm() {
    ['track','course','lesson','topic'].forEach(id => document.getElementById(id).value = '');
    State.links = [];
    displayLinks();
    updateURLPreview();
    buildCheckboxes();
    toastMsg('cleared', null, 'info');
  },

  selectAllTypes() {
    document.querySelectorAll('.cb-type:not(:disabled)').forEach(cb => cb.checked = true);
    if (State.links.length) this.generate(true);
  },

  deselectAllTypes() {
    document.querySelectorAll('.cb-type').forEach(cb => cb.checked = false);
    if (State.links.length) this.generate(true);
  },

  loadHistory(i) {
    const entry = State.history[i];
    const { params, types } = entry;
    ['track','course','lesson','topic'].forEach(k => {
      document.getElementById(k).value = params[k] || '';
    });
    buildCheckboxes();
    setTimeout(() => {
      document.querySelectorAll('.cb-type').forEach(cb => {
        cb.checked = types.includes(cb.value);
      });
      this.generate(true);
    }, 50);
    toastMsg('historyLoaded', null, 'success');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  },

  clearHistory() {
    State.history = [];
    State.save();
    displayHistory();
    toastMsg('historyClearedMsg', null, 'info');
  },

  switchLang(lang, btn) {
    State.lang = lang;
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';

    document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');

    // Update all labeled elements
    const tMap = {
      mainTitle: 'mainTitle', subtitle: 'subtitle', configLabel: 'configLabel',
      typesLabel: 'typesLabel', outputLabel: 'outputLabel', historyLabel: 'historyLabel',
      trackLabel: 'trackLabel', courseLabel: 'courseLabel', lessonLabel: 'lessonLabel',
      topicLabel: 'topicLabel', optionalLabel: 'optionalLabel', kbdHint: 'kbdHint',
      generateLabel: 'generateLabel', copyAllLabel: 'copyAllLabel', exportLabel: 'exportLabel',
      clearLabel: 'clearLabel', selAllBtn: 'selAllBtn', deselAllBtn: 'deselAllBtn',
      baseUrlToggleLabel: 'baseUrlToggleLabel', linkCountLabel: 'linkCountLabel',
      catLabel: 'catLabel', totalLabel: 'totalLabel', emptyLabel: 'emptyLabel',
      clearHistoryBtn: 'clearHistoryBtn', historyEmptyLabel: 'historyEmptyLabel',
      copyAllBottomBtn: 'copyAllBottomBtn'
    };

    Object.entries(tMap).forEach(([elId, key]) => {
      const el = document.getElementById(elId);
      if (el && T[lang][key]) el.textContent = T[lang][key];
    });

    document.getElementById('searchInput').placeholder = T[lang].searchPlaceholder;

    buildCheckboxes();
    displayLinks();
    displayHistory();
  }
};

/* ── INPUT WIRING ── */
['track','course','lesson','topic'].forEach(id => {
  const el = document.getElementById(id);
  el.addEventListener('input', (e) => {
    e.target.value = e.target.value.toLowerCase().replace(/\s+/g, '-');
    e.target.classList.toggle('has-value', !!e.target.value);
    updateURLPreview();
    buildCheckboxes(); // re-evaluate disabled states
    if (State.links.length > 0) App.generate(true); // live refresh
  });
});

/* ── KEYBOARD SHORTCUTS ── */
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); App.generate(); }
  if ((e.metaKey || e.ctrlKey) && e.shiftKey && e.key === 'C') { e.preventDefault(); App.copyAll(); }
  if (e.key === 'Escape') App.clearForm();
});

/* ── INIT ── */
document.addEventListener('DOMContentLoaded', () => {
  lucide.createIcons();
  buildCheckboxes();
  displayHistory();
  updateURLPreview();
});
</script>
</body>
</html>
